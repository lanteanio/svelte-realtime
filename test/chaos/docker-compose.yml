services:
  redis:
    image: redis:7-alpine
    container_name: svelte-realtime-chaos-redis
    # global-setup reserves an OS-free host port and supplies it for the whole
    # run. An anonymous "0:6379" binding is not stable across `compose stop`
    # / `compose start` on Docker Desktop, which strands reconnecting clients
    # on the old port and turns the recovery drill into a harness failure.
    ports:
      - "${CHAOS_REDIS_PORT:-0}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 1s
      retries: 30
