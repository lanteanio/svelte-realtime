name: External documentation links
on:
  schedule:
    - cron: '43 5 * * 2'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  external-links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:links:external -- --concurrency=4 --timeout-ms=15000 --max-redirects=6
