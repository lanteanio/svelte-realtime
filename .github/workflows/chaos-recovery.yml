name: recovery chaos

on:
  pull_request:
    paths:
      - 'src/**'
      - 'test/chaos/**'
      - 'scripts/check-chaos-isolation.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/chaos-recovery.yml'
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-chaos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery-chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out realtime event revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            test/fixture/package-lock.json
      - name: Install realtime and fixture dependencies
        run: |
          npm ci
          npm ci --prefix test/fixture
      - name: Install Chromium
        run: npm exec -- playwright install --with-deps chromium
      - name: Verify Docker daemon
        run: docker info
      - name: Verify concurrent chaos isolation
        run: npm run test:chaos:parallel
      - name: Run Redis and instance recovery at the event revision
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: test/chaos/test-results/recovery-junit.xml
        run: npm exec -- playwright test --config test/chaos/playwright.config.js recovery.spec.js --reporter=line,junit
      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recovery-chaos-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: test/chaos/test-results/**
