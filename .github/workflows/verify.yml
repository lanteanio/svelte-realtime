name: Package verification
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            test/fixture/package-lock.json
      - name: Install realtime and fixture dependencies
        run: |
          npm ci
          npm ci --prefix test/fixture
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:pr
        env:
          RELEASE_LEDGER_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npm run test:smooth-stack
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            test/fixture/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
      - name: Exercise the manual counter in a fresh app
        run: node scripts/check-manual-setup.js --fresh-install
  kit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            test/fixtures/kit2/package-lock.json
            test/fixtures/kit2-vite5/package-lock.json
            test/fixtures/kit3/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm ci --install-links --prefix test/fixtures/kit2
      - run: npm ci --install-links --prefix test/fixtures/kit2-vite5
      - run: npm ci --install-links --prefix test/fixtures/kit3
      - run: npm run test:kit
      - run: npm run test:scaffold
  svelte4:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: test/fixtures/svelte4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: test/fixtures/svelte4/.nvmrc
          cache: npm
          cache-dependency-path: test/fixtures/svelte4/package-lock.json
      - run: npm ci --install-links
      - run: npm exec -- svelte-adapter-uws-preflight
      - run: npm exec -- playwright install --with-deps chromium
      - run: npm run build
      - run: npm run check
      - run: npm run stores
      - run: npm run smoke
