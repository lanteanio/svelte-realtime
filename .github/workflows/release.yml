name: release

# This workflow is the only supported publisher for this package. The matching
# npm trusted-publisher identity and protected GitHub environment are external
# prerequisites documented in releasing.md. Without either, publication fails
# closed; there is deliberately no token fallback or manual dispatch path.
#
# The two jobs exist for one reason: `id-token: write` is a JOB-scoped grant,
# so any job that can mint an OIDC token grants it to everything that runs
# there. `verify` installs dependencies and runs the suite - thousands of
# third-party lifecycle scripts - and therefore holds no publication identity
# at all. `publish` holds the identity but never installs a dependency tree or
# executes repository code; it only downloads the artifact `verify` retained
# and hands that exact file to npm.

on:
  push:
    tags:
      - 'svelte-realtime@*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify tag identity and retain the exact tarball
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      filename: ${{ steps.pack.outputs.filename }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - name: Check out immutable tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node and npm registry
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.13.1'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pinned npm
        run: npm install --global npm@11.8.0

      - name: Install locked root dependencies
        run: npm ci

      - name: Verify tag, package, and source identity
        run: node scripts/prepare-release.js

      - name: Install locked fixture dependencies
        run: npm ci --prefix test/fixture

      - name: Install Chromium
        run: npm exec -- playwright install --with-deps chromium

      - name: Verify Docker daemon
        run: docker info

      - name: Run the complete release verification contract
        run: npm run verify:release

      - name: Run the publication lifecycle gate
        run: npm run prepublishOnly

      - name: Verify retained source identity
        run: node scripts/prepare-release.js

      - name: Pack retained artifact
        id: pack
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force release-artifacts | Out-Null
          $packJson = npm pack --json --pack-destination release-artifacts
          if ($LASTEXITCODE -ne 0) { throw 'npm pack failed' }
          $records = @($packJson | ConvertFrom-Json)
          if ($records.Count -ne 1) { throw 'npm pack did not return exactly one artifact' }
          $filename = [IO.Path]::GetFileName([string]$records[0].filename)
          if ($filename -notmatch '^[a-z0-9._-]+\.tgz$') { throw 'npm pack returned an unsafe artifact name' }
          $tarball = 'release-artifacts/' + $filename
          if (-not (Test-Path -LiteralPath $tarball -PathType Leaf)) { throw 'retained tarball is missing' }
          $sha256 = (Get-FileHash -LiteralPath $tarball -Algorithm SHA256).Hash.ToLowerInvariant()
          'tarball=' + $tarball >> $env:GITHUB_OUTPUT
          'filename=' + $filename >> $env:GITHUB_OUTPUT
          'sha256=' + $sha256 >> $env:GITHUB_OUTPUT

      - name: Retain exact publication artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-candidate-${{ github.run_attempt }}
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 90

  publish:
    name: publish the retained tarball with trusted OIDC
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out immutable tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pinned Node and npm registry
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.13.1'
          registry-url: 'https://registry.npmjs.org'

      - name: Install OIDC-capable npm
        run: npm install --global npm@11.8.0

      - name: Download the retained publication artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-candidate-${{ github.run_attempt }}
          path: release-artifacts

      # download-artifact checks the artifact digest itself, but a mismatch is
      # only a warning in the run log - the job keeps going and publishes. The
      # two-job split moved the publication identity away from the test suite;
      # without this, the artifact handed between the jobs reopens the same hole
      # from the other side. Nothing but a byte comparison closes it.
      - name: Refuse to publish anything but the verified bytes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '${{ needs.verify.outputs.sha256 }}'
          if ($expected -notmatch '^[0-9a-f]{64}$') { throw 'the verify job produced no usable digest' }
          $filename = '${{ needs.verify.outputs.filename }}'
          if ($filename -notmatch '^[a-z0-9._-]+\.tgz$') { throw 'refusing an unsafe artifact name' }
          $tarball = 'release-artifacts/' + $filename
          if (-not (Test-Path -LiteralPath $tarball -PathType Leaf)) { throw 'downloaded tarball is missing' }
          $actual = (Get-FileHash -LiteralPath $tarball -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'downloaded tarball is not the verified artifact' }
          'verified digest ' + $actual

      - name: Publish exact tarball to quarantine with trusted OIDC
        run: npm publish "release-artifacts/${{ needs.verify.outputs.filename }}" --tag candidate --provenance --ignore-scripts
